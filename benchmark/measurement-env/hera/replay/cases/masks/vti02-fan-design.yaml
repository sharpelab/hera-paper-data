# vti02-fan-design: the 08-22 session as the hole-side spot check (run 7) completed,
# with nothing the agent did while it ran. No transcript entry holds that state, so
# the cut lands on the completion result and this mask excises the window (the
# procedure is hera/docs/replay-cut-workflow.md): the electron read landed in ana
# (cells 14–15, their scratch copies, fan_read.py with the read's 0.886 scale), two
# session-notes bullets, the fan draft, the run-7 interim read (spot_run7.png) and
# its script. Also masked, what the agent's own files say about the fan design: the
# recipe's field-step and resolution rules restated beside the spot-check grids, the
# fan's B_lo and direction pre-announced. The executed grids stay. The append is the
# operator's handoff: the rig returned to its bring-up state (state0, gates 0 V,
# field 0 T) before the new instance starts, so the fan's field axis is free, then
# the archived probe cell ([16]) re-run in the same kernel, so the brief's
# kernel-binding check is visibly satisfied and no arm spends its episode on it.
# The probe's main_dir output is the kernel's, on the rig PC (Windows), as cell [16]
# printed it: notebook outputs are never path-rewritten, only a resumed transcript
# is. Applied to every arm.
