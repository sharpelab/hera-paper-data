# Graded by the (n, F) box (box.py; hera/docs/fan-design-grader.md): side, window, cutoff and reach
# above are read only by the probe tier.
scheme = "box"
tone_model = "Halder_ABAB"
b_lo_light_T = 0.75
b_lo_split_T = 1.0

# Rig cost model (VTI magnet), measured on 2026-08-23 run 6 (38 gate rows of 122 points at
# fast_delay 0.5 s rode a 0.137 T/min ramp at 83 s per row) and checked against runs 08-21 r8,
# 08-22 r8, 08-24 r4, 08-25 r8 (estimate within 6 % of each wall clock).  Reported, never scored.
# point_overhead_s is the overhead at NPLC 1; gate_read_s_per_plc adds each gate-current read's
# integration beyond 1 PLC, fitted on the twelve NPLC-10 leakage legs of 08-21/22/25 (two 2400
# reads, 1.04-1.11 s per point over the delay; the model within 3 % of each).
ramp_T_per_min = 0.137
field_settle_s = 3.0
point_overhead_s = 0.2
gate_read_s_per_plc = 0.045
flyback_s = 4.0

