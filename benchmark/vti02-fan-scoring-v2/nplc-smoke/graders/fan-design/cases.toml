# What each fan-design case is read against: the carrier side the evidence favours, the
# density window the fan's claim needs, the field it has to reach, the low-field cutoff below
# which rows are not asked of the design, and the density scale that turns the session's
# calibration frame into the frame the tones live in.  Keyed by replay case name; `source` is
# the archive dir the case cuts, which is how a bare archive (no episode.json) finds its table.
# Every value is provisional: read out of the archives, not ruled by Aaron.

